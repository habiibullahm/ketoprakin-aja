services:
  db-init:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: npm run db:init
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    restart: "no"
    networks:
      - ketoprakin-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ketoprakin-backend
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ketoprakin-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ketoprakin-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ketoprakin-network

networks:
  ketoprakin-network:
    driver: bridge
